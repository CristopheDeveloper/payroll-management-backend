
name: Planilla API - Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build and Docker
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Planilla.slnx

      - name: Build
        run: dotnet build Planilla.slnx -c Release --no-restore

      - name: Run tests
        run: dotnet test Planilla.slnx -c Release --no-build

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: planilla-api:prod
